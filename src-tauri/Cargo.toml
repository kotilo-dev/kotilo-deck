[package]
name = "kotilo-deck"
version = "0.0.1"
description = "Full-screen developer dashboard for a secondary display"
authors = ["Kotilo"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "kotilo_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
