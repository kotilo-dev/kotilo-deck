[package]
name = "kotilo-deck"
version = "0.0.1"
description = "Full-screen developer dashboard for a secondary display"
authors = ["Kotilo"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "kotilo_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-store = "2.4.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
sysinfo = "0.36.1"
chrono = "0.4.45"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros", "net", "fs", "io-util"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
# Phase 3 calendar: RRULE expansion + IANA zones for ICS feeds
rrule = "0.14.0"
chrono-tz = "0.10.4"
# Phase 3 companion server (protocol.md)
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# Phase 4 auto-update (backend-owned; no JS packages)
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# Phase 4 LAN mode: plain hyper (already in the tree via reqwest) + the tungstenite above
# instead of a framework; sha2/base64 hash the SPA's inline script for the CSP header.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sha2 = "0.10"
base64 = "0.23.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
if-addrs = "0.15.0"

[dev-dependencies]
tempfile = "3.27.0"
# companion tests: spawn scripts/mock-desktop.mjs
tokio = { version = "1.53.3", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    # Phase 2 overlay window opacity
    "Win32_UI_WindowsAndMessaging",
    # Phase 2 audio (Core Audio) + media (GSMTC)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "ApplicationModel",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    # Phase 3 companion_open_desktop (URL scheme lookup + ShellExecute)
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
# `#[implement]` / `#[interface]` (COM callbacks, IPolicyConfig) expand to `::windows_core`.
windows-core = "0.62"

# Phase 4 Linux media: MPRIS over the session D-Bus (blocking API on the platform's threads).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# `platform::linux` also compiles under `cfg(test)` on other OSes (ARCHITECTURE.md), so its
# MPRIS code is type-checked and unit-tested on the Windows dev machine.
[target.'cfg(not(target_os = "linux"))'.dev-dependencies]
zbus = "5"
