[package]
name = "kotilo-deck"
version = "0.0.1"
description = "Full-screen developer dashboard for a secondary display"
authors = ["Kotilo"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "kotilo_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-store = "2.4.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
sysinfo = "0.36.1"
chrono = "0.4.45"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Foundation"] }
