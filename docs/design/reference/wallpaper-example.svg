<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!-- Kotilo Deck demo wallpaper ("Ember"). Made for this repo, MIT like the rest of it.
       Warm autumn gradient field: deep red-brown base, orange and gold glows, a misty light centre,
       a dark band at the bottom. Stands in for a photo wallpaper in the glass-look references. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1d12"/>
      <stop offset="0.55" stop-color="#7a2e14"/>
      <stop offset="1" stop-color="#1e1612"/>
    </linearGradient>
    <radialGradient id="orangeL" cx="0.12" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#f08a2c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f08a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redR" cx="0.86" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#c2361f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2361f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.62" cy="0.42" r="0.38">
      <stop offset="0" stop-color="#f4b850" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f4b850" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="0.5" cy="0.56" r="0.3">
      <stop offset="0" stop-color="#e6d6c0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e6d6c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberB" cx="0.22" cy="0.88" r="0.4">
      <stop offset="0" stop-color="#d0601f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d0601f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberR" cx="0.92" cy="0.8" r="0.35">
      <stop offset="0" stop-color="#e07a2a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#e07a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#14100e" stop-opacity="0"/>
      <stop offset="1" stop-color="#14100e" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#orangeL)"/>
  <rect width="1920" height="1080" fill="url(#redR)"/>
  <rect width="1920" height="1080" fill="url(#gold)"/>
  <rect width="1920" height="1080" fill="url(#mist)"/>
  <rect width="1920" height="1080" fill="url(#emberB)"/>
  <rect width="1920" height="1080" fill="url(#emberR)"/>
  <rect width="1920" height="1080" fill="url(#floor)"/>
</svg>
