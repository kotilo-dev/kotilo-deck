name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:hex
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # README screenshots + GIF from the in-memory demo backend (`/?demo`). Uploaded for review, never committed from CI.
  screenshots:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs frontendDist to exist at compile time.
      - run: mkdir -p ../build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-build:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # --no-bundle skips the installers, so createUpdaterArtifacts never asks for
      # TAURI_SIGNING_PRIVATE_KEY (only the bundler signs updater artifacts).
      - run: pnpm tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: kotilo-deck-windows
          path: src-tauri/target/release/kotilo-deck.exe

  # SPEC §8 performance budget: idle CPU/RAM with every built-in widget on screen, on the
  # release binary from windows-build. See the header of scripts/soak.mjs for what counts.
  soak:
    runs-on: windows-latest
    needs: [windows-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: kotilo-deck-windows
          path: soak-bin
      # Gate = SPEC target (DECISIONS 102): RAM < 160 MB tree / < 60 MB deck process, no
      # tolerance; CPU 1 % + 25 % (1.25 %), since the runner has no GPU (software rendering)
      # and shares its host. The summary marks a CPU miss of the real 1 % in bold.
      - name: Idle soak (60 s warm-up + 10 min)
        run: >-
          node scripts/soak.mjs --app soak-bin/kotilo-deck.exe --minutes 10 --warmup 60
          --cpu-tolerance 25
          --json soak-out/soak-result.json --logs soak-out/logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-result
          path: soak-out
          if-no-files-found: ignore
